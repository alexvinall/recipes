<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipes</title>
  <link rel="stylesheet" href="/recipes/css/style.css">
</head>
<body>
  <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle color theme">Toggle theme</button>

  <main class="container stack">
    <header class="page-header stack">
      <h1>Recipes</h1>
      <p class="lede">Recipes we cook regularly at home for our family.</p>
      <input id="searchInput" type="search" placeholder="Search recipes" aria-label="Search recipes">
    </header>

    <section aria-live="polite" aria-label="Search results">
      <ul id="searchResults" class="recipe-grid" hidden></ul>
    </section>

    <section>
      <ul class="recipe-grid">
      
        <li class="recipe-card">
          <a class="recipe-link" href="/recipes/orange-chicken/">
            <h2>Orange Chicken</h2>
            <p>Published <time datetime="2025-07-02">July 2, 2025</time></p>
          </a>
        </li>
      
        <li class="recipe-card">
          <a class="recipe-link" href="/recipes/al-pastor/">
            <h2>Slow Cooker Al Pastor</h2>
            <p>Published <time datetime="2025-01-01">January 1, 2025</time></p>
          </a>
        </li>
      
      </ul>
    </section>

    <script>
    const root = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');

    function getActiveTheme() {
      const stored = localStorage.getItem('theme');
      if (stored === 'light' || stored === 'dark') return stored;
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function setTheme(theme) {
      root.setAttribute('data-theme', theme);
      themeToggle.textContent = theme === 'dark' ? '☀️ Light mode' : '🌙 Dark mode';
      themeToggle.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
    }

    setTheme(getActiveTheme());

    themeToggle.addEventListener('click', () => {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      setTheme(next);
    });

    const searchInput = document.getElementById('searchInput');
    const resultsList = document.getElementById('searchResults');
    let index = [];
    fetch('/recipes/search.json')
      .then(r => r.json())
      .then(data => index = data);

    function renderResults(items) {
      resultsList.innerHTML = '';
      if (items.length === 0) {
        resultsList.hidden = true;
        return;
      }
      items.forEach(item => {
        const li = document.createElement('li');
        li.className = 'recipe-card';

        const a = document.createElement('a');
        a.className = 'recipe-link';
        a.href = item.url;

        const title = document.createElement('h2');
        title.textContent = item.title;

        a.appendChild(title);
        li.appendChild(a);
        resultsList.appendChild(li);
      });
      resultsList.hidden = false;
    }

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.trim().toLowerCase();
      if (!query) {
        renderResults([]);
        return;
      }
      const matches = index.filter(r =>
        r.title.toLowerCase().includes(query) ||
        r.content.toLowerCase().includes(query)
      );
      renderResults(matches);
    });
    </script>
  </main>
</body>
</html>
